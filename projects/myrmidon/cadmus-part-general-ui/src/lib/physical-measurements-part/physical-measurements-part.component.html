<form [formGroup]="form" (submit)="save()">
  <mat-card>
    <mat-card-header>
      <div mat-card-avatar>
        <mat-icon>picture_in_picture</mat-icon>
      </div>
      <mat-card-title>{{
        (modelName() | titlecase) || "Physical Measurements Part"
      }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <cadmus-mat-physical-measurement-set
        [nameEntries]="nameEntries()"
        [unitEntries]="unitEntries() || []"
        [dimTagEntries]="dimTagEntries()"
        [measurements]="measurements.value"
        (measurementsChange)="onMeasurementsChange($event!)"
      />

      @if (formulaResults().length) {
        <table class="formula-results">
          <caption>Computed values</caption>
          <tbody>
            @for (result of formulaResults(); track result.key) {
              <tr
                [class.ambiguous]="result.ambiguous"
                [title]="
                  result.ambiguous
                    ? 'This value uses the first of several measurements sharing the same name'
                    : ''
                "
              >
                <th scope="row">{{ result.key }}</th>
                <td>{{ result.formatted }}</td>
                <td>{{ result.intervalName }}</td>
              </tr>
            }
          </tbody>
        </table>
      }
    </mat-card-content>
    <mat-card-actions>
      <cadmus-close-save-buttons
        [form]="form"
        [noSave]="userLevel < 2"
        (closeRequest)="close()"
      />
    </mat-card-actions>
  </mat-card>
</form>
