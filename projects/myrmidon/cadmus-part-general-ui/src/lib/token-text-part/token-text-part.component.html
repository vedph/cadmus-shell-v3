<mat-card appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar>
      <mat-icon>picture_in_picture</mat-icon>
    </div>
    <mat-card-title>{{
      (modelName() | titlecase) || "Token Text Part"
    }}</mat-card-title>
    <cadmus-help-link [url]="helpUrl()" />
  </mat-card-header>

  <mat-card-content>
    <div id="container">
      <div id="cit">
        <!-- citation -->
        <mat-form-field>
          <mat-label>citation</mat-label>
          <input matInput [formField]="form.citation" />
        </mat-form-field>
      </div>

      <!-- transforms -->
      <div id="trs">
        <mat-form-field>
          <mat-label>operation</mat-label>
          <mat-select [(value)]="transform">
            <mat-option value="ws">normalize ws</mat-option>
            <mat-option value="split">split at stops</mat-option>
          </mat-select>
        </mat-form-field>
        <button
          type="button"
          mat-icon-button
          matTooltip="Apply the selected text transformation"
          (click)="applyTransform()"
        >
          <mat-icon class="mat-warn">find_replace</mat-icon>
        </button>
      </div>

      <!-- text -->
      <div id="txt">
        <ngx-monaco-editor
          [formField]="form.text"
          [language]="'plaintext'"
          [options]="editorOptions"
        />
        @if (form.text().getError("required") && (form.text().touched() || form.text().dirty())) {
          <mat-error>please enter some text</mat-error>
        }
      </div>
    </div>

    <mat-card-actions>
      <cadmus-close-save-buttons
        [form]="form"
        [noSave]="userLevel < 2"
        (closeRequest)="close()"
        (saveRequest)="save()"
      />
    </mat-card-actions>
  </mat-card-content>
</mat-card>
