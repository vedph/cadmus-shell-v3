<div [attr.disabled]="disabled() ? true : null">
  <!-- subject -->
  <div class="form-row">
    <cadmus-refs-lookup
      [service]="lookupService"
      [item]="subjectNode$ | async"
      label="subject"
      (itemChange)="onSubjectNodeChange($event)"
    />
    <button
      type="button"
      mat-icon-button
      style="margin-top: 20px"
      (click)="clearSubjectNode()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
  </div>
  <!-- predicate -->
  <div class="form-row">
    <cadmus-refs-lookup
      [service]="lookupService"
      label="predicate"
      [item]="predicateNode$ | async"
      [baseFilter]="{ tag: 'property' }"
      (itemChange)="onPredicateNodeChange($event)"
    />
    <button
      type="button"
      mat-icon-button
      style="margin-top: 20px"
      (click)="clearPredicateNode()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
  </div>
  <!-- object, objectLit -->
  <div>
    <mat-checkbox [formField]="form.literal">literal</mat-checkbox>
  </div>
  @if (form.literal().value()) {
  <div>
    <mat-label>literal</mat-label>
    <mat-form-field>
      <input
        matInput
        [formField]="form.objectLit"
        (keydown.enter)="!disabled() && apply()"
      />
    </mat-form-field>
  </div>
  } @else {
  <div class="form-row">
    <cadmus-refs-lookup
      [service]="lookupService"
      [item]="objectNode$ | async"
      label="object"
      (itemChange)="onObjectNodeChange($event)"
    />
    <button
      type="button"
      mat-icon-button
      style="margin-top: 20px"
      (click)="clearObjectNode()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
  </div>
  }
  <!-- sid, sidPrefix -->
  <div>
    <mat-form-field>
      <mat-label>sid</mat-label>
      <input
        matInput
        [formField]="form.sid"
        (keydown.enter)="!disabled() && apply()"
      />
    </mat-form-field>
    &nbsp;
    <mat-checkbox [formField]="form.sidPrefix">prefix</mat-checkbox>
  </div>
  <!-- tag -->
  <div>
    <mat-form-field>
      <mat-label>tag</mat-label>
      <input
        matInput
        [formField]="form.tag"
        (keydown.enter)="!disabled() && apply()"
      />
    </mat-form-field>
  </div>
  <br />
  <div
    class="btn-group"
    role="group"
    aria-label="toolbar"
    style="margin-bottom: 10px"
  >
    <button
      mat-icon-button
      type="button"
      (click)="reset()"
      matTooltip="Reset filters"
      [disabled]="disabled()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      [disabled]="disabled()"
      matTooltip="Apply filters"
      (click)="apply()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
