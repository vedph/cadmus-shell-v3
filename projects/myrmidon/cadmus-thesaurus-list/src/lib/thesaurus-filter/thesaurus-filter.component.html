<div role="form">
  <div class="form-row">
    <!-- id -->
    <div>
      <mat-form-field>
        <mat-label>ID</mat-label>
        <input matInput [formField]="form.id" (keydown.enter)="apply()" />
      </mat-form-field>
    </div>

    <!-- language -->
    <div>
      <mat-form-field>
        <mat-label>language</mat-label>
        <input matInput [formField]="form.language" (keydown.enter)="apply()" />
      </mat-form-field>
    </div>

    <!-- alias -->
    <div>
      <mat-form-field>
        <mat-label>alias</mat-label>
        <mat-select [formField]="form.alias">
          <mat-option [value]="null">(any)</mat-option>
          <mat-option [value]="true">alias</mat-option>
          <mat-option [value]="false">not an alias</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div>
    <button
      type="button"
      mat-icon-button
      (click)="reset()"
      matTooltip="Reset all the filters"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      [disabled]="form().invalid()"
      matTooltip="Apply filters"
      (click)="apply()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
