<cadmus-current-item-bar />
@let loc = frLoc();
<div class="base-text">
  <cadmus-decorated-token-text
    [baseText]="data()?.baseText || ''"
    [locations]="loc ? [loc] : []"
  />
</div>
<!-- identity was missing here: CommentEditorComponent's initSettings() call
     needs it to load lookupProviderOptions settings (else lookups never
     get configured) -->
<cadmus-comment-editor
  [identity]="identity()"
  [data]="$any(data())"
  (dataChange)="save($any($event!.value!))"
  (editorClose)="close()"
  (dirtyChange)="onDirtyChange($event)"
/>
