<cadmus-current-item-bar/>
@let loc = frLoc();
<div class="base-text">
  <cadmus-decorated-token-text
    [baseText]="data()?.baseText || ''"
    [locations]="loc ? [loc] : []"
  />
</div>
<!-- identity was missing here: ModelEditorComponentBase's modelName() falls
     back to the layer part's own name (wrong title) without it -->
<cadmus-chronology-fragment
  [identity]="identity()"
  [data]="$any(data())"
  (dataChange)="save($event!.value!)"
  (editorClose)="close()"
  (dirtyChange)="onDirtyChange($event)"
/>
