<div [attr.disabled]="disabled()">
  <!-- paginator -->
  @if (hasPager()) {
  <mat-paginator
    [length]="total()"
    [pageSize]="form.pageSize().value() || 10"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
    aria-label="Select page"
  />
  }

  <!-- label -->
  <div>
    <mat-form-field>
      <input
        matInput
        [formField]="form.label"
        placeholder="label"
        (keydown.enter)="!disabled() && apply()"
      />
    </mat-form-field>
  </div>
  <!-- uid -->
  <div>
    <mat-form-field>
      <input
        matInput
        [formField]="form.uid"
        placeholder="UID"
        (keydown.enter)="!disabled() && apply()"
      />
    </mat-form-field>
  </div>
  <!-- isClass -->
  <div>
    <mat-form-field>
      <mat-select [formField]="form.isClass" placeholder="class">
        <mat-option [value]="null">(any)</mat-option>
        <mat-option [value]="true">class</mat-option>
        <mat-option [value]="false">not-class</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <!-- tag -->
  <div>
    <mat-form-field>
      <input
        matInput
        [formField]="form.tag"
        placeholder="tag"
        (keydown.enter)="!disabled() && apply()"
      />
    </mat-form-field>
  </div>
  <!-- sourceType -->
  <div>
    <mat-form-field>
      <mat-select [formField]="form.sourceType" placeholder="source type">
        <mat-option [value]="null">(any)</mat-option>
        <mat-option [value]="0">user</mat-option>
        <mat-option [value]="1">item</mat-option>
        <mat-option [value]="2">part</mat-option>
        <mat-option [value]="3">thesaurus</mat-option>
        <mat-option [value]="4">implicit</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div>
    <!-- sid -->
    <div>
      <mat-form-field>
        <input
          matInput
          [formField]="form.sid"
          placeholder="SID"
          (keydown.enter)="!disabled() && apply()"
        />
      </mat-form-field>

      <!-- isSidPrefix -->
      <mat-checkbox [formField]="form.isSidPrefix">prefix</mat-checkbox>
    </div>
  </div>
  <!-- classes -->
  <div>
    <fieldset>
      <legend>classes</legend>
      <cadmus-refs-lookup
        label="class"
        [service]="lookupService"
        [baseFilter]="{ isClass: true }"
        (itemChange)="onClassAdd($event)"
      />

      @if (form.classes().value().length) {
      <mat-chip-listbox>
        @for (node of form.classes().value(); track node.id) {
        <mat-chip-option
          [removable]="true"
          (removed)="onClassRemove(node)"
          matTooltip="{{ node.uri }}"
          >{{ node.label }}
          <button type="button" matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-option>
        }
      </mat-chip-listbox>
      }
    </fieldset>
  </div>

  <div
    class="btn-group"
    role="group"
    aria-label="toolbar"
    style="margin-bottom: 10px"
  >
    <button
      mat-icon-button
      type="button"
      (click)="reset()"
      matTooltip="Reset filters"
      [disabled]="disabled()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      [disabled]="disabled()"
      matTooltip="Apply filters"
      (click)="apply()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
