<div [attr.disabled]="disabled()">
  <!-- paginator -->
  @if (hasPager()) {
  <mat-paginator
    [length]="total()"
    [pageSize]="form.pageSize().value() || 10"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
    aria-label="Select page"
  />
  }
  <mat-tab-group>
    <!-- TRIPLE -->
    <mat-tab label="triple">
      <!-- subject ID -->
      <div>
        <cadmus-refs-lookup
          label="subject"
          [service]="lookupService"
          [item]="form.subj().value()"
          (itemChange)="onSubjectNodeChange($event)"
        />
      </div>
      <!-- predicate IDs -->
      <div>
        <cadmus-refs-lookup
          label="predicate"
          [service]="lookupService"
          [baseFilter]="{ tag: 'property' }"
          (itemChange)="onPredicateNodeChange($event)"
        />
        <mat-checkbox [formField]="form.isNotPred">not</mat-checkbox>
        <!-- notPreds -->
        @if (form.isNotPred().value()) {
        <div>
          <mat-list dense>
            @for (n of form.notPreds().value(); track n.id) {
            <mat-list-item>
              <span>{{ n.label }}</span>
              <button type="button" mat-icon-button (click)="deleteNotPred(n)">
                <mat-icon class="mat-warn">clear</mat-icon>
              </button>
            </mat-list-item>
            }
          </mat-list>
        </div>
        }
        <!-- preds -->
        @if (!form.isNotPred().value()) {
        <div>
          <mat-list dense>
            @for (n of form.preds().value(); track n.id) {
            <mat-list-item>
              <span>{{ n.label }}</span>
              <button type="button" mat-icon-button (click)="deletePred(n)">
                <mat-icon class="mat-warn">clear</mat-icon>
              </button>
            </mat-list-item>
            }
          </mat-list>
        </div>
        }
      </div>
      <!-- object ID -->
      <div>
        <cadmus-refs-lookup
          label="object"
          [service]="lookupService"
          [item]="form.obj().value()"
          (itemChange)="onObjectNodeChange($event)"
        />
      </div>
      <!-- sid -->
      <div>
        <mat-form-field>
          <input
            matInput
            [formField]="form.sid"
            placeholder="sid"
            (keydown.enter)="!disabled() && apply()"
          />
        </mat-form-field>
        &nbsp;
        <mat-checkbox [formField]="form.isSidPrefix">prefix</mat-checkbox>
      </div>
      <!-- tag -->
      <div>
        <mat-form-field>
          <input
            matInput
            [formField]="form.tag"
            placeholder="tag"
            (keydown.enter)="!disabled() && apply()"
          />
        </mat-form-field>
      </div>
    </mat-tab>
    <!-- LITERAL -->
    <mat-tab label="literal">
      <!-- litPattern -->
      <div>
        <mat-form-field>
          <input
            matInput
            [formField]="form.litPattern"
            placeholder="pattern"
            (keydown.enter)="!disabled() && apply()"
          />
        </mat-form-field>
      </div>
      <!-- litType -->
      <div>
        <mat-form-field>
          <input
            matInput
            [formField]="form.litType"
            placeholder="type"
            (keydown.enter)="!disabled() && apply()"
          />
        </mat-form-field>
      </div>
      <!-- litLanguage-->
      <div>
        <mat-form-field>
          <input
            matInput
            [formField]="form.litLanguage"
            placeholder="language"
            (keydown.enter)="!disabled() && apply()"
          />
        </mat-form-field>
      </div>
      <!-- minLitNumber, maxLitNumber -->
      <div>
        <mat-form-field style="width: 4em">
          <input
            matInput
            type="number"
            [formField]="form.minLitNumber"
            (keydown.enter)="!disabled() && apply()"
            placeholder="min."
          />
        </mat-form-field>
        -
        <mat-form-field style="width: 4em">
          <input
            matInput
            type="number"
            [formField]="form.maxLitNumber"
            (keydown.enter)="!disabled() && apply()"
            placeholder="max."
          />
        </mat-form-field>
      </div>
    </mat-tab>
  </mat-tab-group>
  <div
    class="btn-group"
    role="group"
    aria-label="toolbar"
    style="margin-bottom: 10px"
  >
    <button
      mat-icon-button
      type="button"
      (click)="reset()"
      matTooltip="Reset filters"
      [disabled]="disabled()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      [disabled]="disabled()"
      matTooltip="Apply filters"
      (click)="apply()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
