<div [attr.disabled]="disabled()">
  <!-- paginator -->
  @if (hasPager()) {
  <mat-paginator
    [length]="total()"
    [pageSize]="form.pageSize().value() || 10"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
    aria-label="Select page"
  />
  }

  <!-- subject ID -->
  <div>
    <cadmus-refs-lookup
      label="subject"
      [service]="lookupService"
      [item]="form.subj().value()"
      (itemChange)="onSubjectNodeChange($event)"
    />
  </div>

  <!-- predicate ID -->
  <div>
    <cadmus-refs-lookup
      label="predicate"
      [service]="lookupService"
      [baseFilter]="{ tag: 'property' }"
      [item]="form.pred().value()"
      (itemChange)="onPredicateNodeChange($event)"
    />
  </div>

  <!-- LITERAL -->
  <!-- litPattern -->
  <div>
    <mat-form-field>
      <input
        matInput
        [formField]="form.litPattern"
        placeholder="pattern"
        (keydown.enter)="!disabled() && apply()"
      />
    </mat-form-field>
  </div>
  <!-- litType -->
  <div>
    <mat-form-field>
      <input
        matInput
        [formField]="form.litType"
        placeholder="type"
        (keydown.enter)="!disabled() && apply()"
      />
    </mat-form-field>
  </div>
  <!-- litLanguage-->
  <div>
    <mat-form-field>
      <input
        matInput
        [formField]="form.litLanguage"
        placeholder="language"
        (keydown.enter)="!disabled() && apply()"
      />
    </mat-form-field>
  </div>
  <!-- minLitNumber, maxLitNumber -->
  <div>
    <mat-form-field style="width: 5em">
      <input
        matInput
        type="number"
        [formField]="form.minLitNumber"
        (keydown.enter)="!disabled() && apply()"
        placeholder="min."
      />
    </mat-form-field>
    -
    <mat-form-field style="width: 5em">
      <input
        matInput
        type="number"
        [formField]="form.maxLitNumber"
        (keydown.enter)="!disabled() && apply()"
        placeholder="max."
      />
    </mat-form-field>
  </div>
  <div
    class="btn-group"
    role="group"
    aria-label="toolbar"
    style="margin-bottom: 10px"
  >
    <button
      mat-icon-button
      type="button"
      (click)="reset()"
      matTooltip="Reset filters"
      [disabled]="disabled()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      [disabled]="disabled()"
      matTooltip="Apply filters"
      (click)="apply()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
