@if (hints().length) {
<div>
  <table class="patches">
    <thead>
      <tr>
        <th></th>
        <th>location</th>
        <th>description</th>
        <th>patch</th>
      </tr>
    </thead>
    <tbody>
      @for (hint of hints(); track hint; let i = $index) {
      <tr>
        @if (!readonly()) {
        <td>
          <button
            type="button"
            mat-icon-button
            matTooltip="Edit this fragment"
            [disabled]="disabled()"
            (click)="emitRequestEdit(hint)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            type="button"
            mat-icon-button
            matTooltip="Move this fragment to {{ targetLocation() }}"
            [disabled]="
              disabled() ||
              !targetLocation() ||
              targetLocation() === hint.location
            "
            (click)="emitRequestMove(hint)"
          >
            <mat-icon>arrow_forward</mat-icon>
          </button>
          <button
            type="button"
            mat-icon-button
            matTooltip="Delete this fragment"
            [disabled]="disabled()"
            (click)="emitRequestDelete(hint)"
          >
            <mat-icon class="mat-warn">delete</mat-icon>
          </button>
        </td>
        }
        <td>{{ hint.location }}</td>
        <td>{{ hint.description }}</td>
        <td>
          @if (hint.patchOperation) {
          <mat-checkbox
            matTooltip="Apply this patch"
            [formField]="form.checks[i]"
          >
            {{ hint.patchOperation }}
          </mat-checkbox>
          }
        </td>
      </tr>
      }
    </tbody>
  </table>
  @if (targetLocation()) {
  <div>move target: {{ targetLocation() }}</div>
  }
  <button
    type="button"
    mat-flat-button
    [disabled]="readonly() || disabled()"
    (click)="emitRequestPatch()"
  >
    apply patches
  </button>
</div>
}
